<!DOCTYPE html>
<html>
<head>
    <title>Speech to Text</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin-bottom: 10px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
            margin: 5px;
        }

        .btn:hover {
            background: #5a67d8;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
        }

        hr {
            margin: 30px 0;
        }

        /* 🔄 Spinner */
        .spinner {
            display: none;
            margin: 20px auto;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Speech-to-Text System</h1>

    <!-- Upload -->
    <form action="/upload" method="post" enctype="multipart/form-data" onsubmit="showUploadSpinner()">
        <input type="file" name="audio" required>
        <br>
        <button type="submit" class="btn" id="uploadBtn">Convert Audio</button>
    </form>

    <hr>

    <!-- Recording -->
    <h3>Record from Microphone</h3>

    <button onclick="startRecording()" class="btn">Start Recording</button>
    <button onclick="stopRecording()" class="btn">Stop Recording</button>

    <p id="status"></p>

    <div id="spinner" class="spinner"></div>

    <!--Text to Speech-->
    <hr>

    <h3>Text to Speech</h3>

    <textarea id="ttsInput" rows="4" placeholder="Enter text here..." style="width:100%; padding:10px;"></textarea>

    <br><br>

    <button onclick="speakCustomText()" class="btn">🔊 Play</button>
    <button onclick="stopSpeech()" class="btn">⏹ Stop</button>

</div>

<script>
let mediaRecorder;
let audioChunks = [];

function showUploadSpinner() {
    document.getElementById("status").innerText = "Processing...";
    document.getElementById("spinner").style.display = "block";

    // disable button to prevent double clicks
    document.getElementById("uploadBtn").disabled = true;
}

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstart = () => {
            document.getElementById("status").innerText = "Recording...";
        };

        mediaRecorder.start();

    } catch (error) {
        alert("Microphone access denied or not supported");
        console.error(error);
    }
}

function stopRecording() {
    if (!mediaRecorder) {
        alert("Recording not started!");
        return;
    }

    mediaRecorder.stop();

    mediaRecorder.onstop = async () => {

        document.getElementById("status").innerText = "Processing...";
        document.getElementById("spinner").style.display = "block";

        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const file = new File([blob], "recording.webm");

        const formData = new FormData();
        formData.append("audio", file);

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const html = await response.text();

            document.open();
            document.write(html);
            document.close();

        } catch (error) {
            alert("Error uploading audio");
            console.error(error);
        }
    };
}

function speakCustomText() {
    const text = document.getElementById("ttsInput").value;

    if (!text.trim()) {
        alert("Please enter text!");
        return;
    }

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.rate = 1;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}

function stopSpeech() {
    speechSynthesis.cancel();
}
</script>

</body>
</html>
